<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ورود به گرایه</title>
  <style>
    @font-face{font-family:ShabnamDashboard;src:url("/auth/assets/fonts/Shabnam.ttf") format("truetype");font-display:swap}
    @font-face{font-family:IRZarWeb;src:url("/auth/assets/fonts/IRZar.ttf") format("truetype");font-display:swap}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#e3efee,#eef6f5,#eaf0f5);font-family:ShabnamDashboard,Shabnam,IRZarWeb,IRZar,"B Zar",Tahoma,sans-serif;color:#002223;padding:20px}
    .shell{width:min(940px,100%);min-height:570px;display:grid;grid-template-columns:1.05fr .95fr;background:#fff;border:1px solid rgba(0,78,79,.16);border-radius:28px;overflow:hidden;box-shadow:0 30px 90px rgba(0,55,56,.14)}
    .visual{background:linear-gradient(145deg,#003738,#004e4f);color:#fff;padding:55px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}.visual:after,.visual:before{content:"";position:absolute;border-radius:50%;background:rgba(0,128,128,.22)}.visual:after{width:360px;height:360px;left:-150px;top:-120px}.visual:before{width:220px;height:220px;right:-80px;bottom:-70px}
    .brand{display:flex;align-items:center;gap:13px;position:relative;z-index:1}.mark{width:56px;height:56px;border-radius:18px;background:#008080;color:#fff;display:grid;place-items:center;font-size:31px;font-weight:700;box-shadow:0 10px 22px rgba(0,0,0,.18)}.brand b{font-size:28px}.brand small{display:block;opacity:.75}.visual h1{font-size:31px;line-height:1.6;margin:0;position:relative;z-index:1}.visual p{opacity:.75;position:relative;z-index:1}
    .form-side{padding:65px 55px;display:flex;flex-direction:column;justify-content:center}.form-side h2{font-size:25px;margin:0 0 27px}.field{display:block;font-size:12px;color:#003738;margin-bottom:15px}.field input{display:block;width:100%;margin-top:5px;border:1px solid rgba(0,78,79,.22);border-radius:12px;padding:11px 13px;font:inherit;outline:none}.field input:focus{border-color:#008080;box-shadow:0 0 0 4px rgba(0,128,128,.12)}.submit{width:100%;border:0;border-radius:12px;padding:11px;background:#006767;color:#fff;font:inherit;cursor:pointer;box-shadow:0 9px 23px rgba(0,55,56,.20)}.submit:hover{background:#003738}.error{min-height:30px;color:#00010d;font-size:12px;padding-top:8px}.secure{color:#426a6b;font-size:11px;text-align:center;margin-top:20px}
    @media(max-width:720px){.shell{grid-template-columns:1fr;min-height:0}.visual{padding:28px}.visual h1,.visual>p{display:none}.form-side{padding:38px 28px}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="visual">
      <div class="brand"><div class="mark">گ</div><div><b>گرایه</b><small>سامانه هوشمند خبرنامه</small></div></div>
    </section>
    <section class="form-side">
      <h2>ورود به سامانه</h2>
      <form id="loginForm">
        <label class="field">نام کاربری<input id="username" autocomplete="username" required autofocus></label>
        <label class="field">رمز عبور<input id="password" type="password" autocomplete="current-password" required></label>
        <button class="submit" type="submit">ورود</button>
        <div class="error" id="error"></div>
      </form>
      <div class="secure">نشست ورود حداکثر ۱۲ ساعت معتبر است.</div>
    </section>
  </main>
  <script>
    document.getElementById("loginForm").addEventListener("submit",async(event)=>{
      event.preventDefault();const button=event.currentTarget.querySelector("button"),error=document.getElementById("error");
      button.disabled=true;button.textContent="در حال بررسی…";error.textContent="";
      try{const response=await fetch("/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("username").value.trim(),password:document.getElementById("password").value})});if(!response.ok){const data=await response.json();throw new Error(data.detail||"ورود ناموفق بود.")}location.replace("/admin")}
      catch(exc){error.textContent=exc.message}
      finally{button.disabled=false;button.textContent="ورود"}
    });
  </script>
</body>
</html>
